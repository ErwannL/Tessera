name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job goes through the Makefile, i.e. through Docker, exactly like a developer.
jobs:
  lint:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  coverage:
    name: Tests with 100% coverage (backend and frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make coverage

  image:
    name: Production image (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make smoke

  e2e:
    name: End-to-end (Playwright on the Docker stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make e2e

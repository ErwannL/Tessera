# Development stack: `make up` (add the demo App with `make up PROFILE=demo`).
# Secrets come from .env (generated by scripts/init-env.sh, ignored by git).
name: tessera

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tessera
      POSTGRES_DB: tessera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make up to generate .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tessera -d tessera']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., target: dev }
    image: tessera-dev:latest
    env_file: .env
    command: ['npx', 'tsx', 'backend/src/main.ts', 'migrate']
    depends_on:
      postgres: { condition: service_healthy }

  tessera:
    image: tessera-dev:latest
    env_file: .env
    # Backend restarts on change (tsx watch); the dashboard is rebuilt on change (vite --watch).
    command:
      - sh
      - -c
      - npm run build -w frontend && (npm run dev -w frontend &) && npm run dev -w backend
    volumes:
      - ./backend/src:/app/backend/src:ro
      - ./frontend/src:/app/frontend/src:ro
    ports:
      - '127.0.0.1:${TESSERA_PORT:-3000}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }

  demo:
    profiles: [demo]
    image: tessera-dev:latest
    command: ['node', 'examples/demo-app/server.ts']
    environment:
      PORT: '4000'
      TESSERA_API_URL: http://tessera:3000
      TESSERA_PUBLIC_URL: http://localhost:${TESSERA_PORT:-3000}
      TESSERA_API_KEY: ${DEMO_API_KEY:?run make up to generate .env}
      TESSERA_HANDOFF_SECRET: ${HANDOFF_SECRET:?run make up to generate .env}
    volumes:
      - ./examples/demo-app:/app/examples/demo-app:ro
    ports:
      - '127.0.0.1:${DEMO_PORT:-4000}:4000'
    depends_on:
      - tessera

volumes:
  pgdata:
